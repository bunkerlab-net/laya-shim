# https://mise.jdx.dev
[settings]
# https://mise.jdx.dev/configuration/settings.html#experimental
experimental = true
# https://mise.jdx.dev/configuration/settings.html#minimum_release_age
minimum_release_age = "1d"
# https://mise.jdx.dev/dev-tools/backends/pipx.html#pipx.uvx
pipx.uvx = true

[tools]
"pipx:ruff" = "0.16"

hk = "2"
uv = "0.12"

# Shim settings. A value set in your shell or in mise.local.toml takes
# precedence over these defaults. See README.md.
[env]
LAYA_BACKEND = "{{ get_env(name='LAYA_BACKEND', default='mlx') }}"
LAYA_MODEL = "{{ get_env(name='LAYA_MODEL', default='convaiinnovations/laya') }}"
LAYA_SUBFOLDER = "{{ get_env(name='LAYA_SUBFOLDER', default='typed-decisions') }}"
LAYA_HOST = "{{ get_env(name='LAYA_HOST', default='127.0.0.1') }}"
LAYA_PORT = "{{ get_env(name='LAYA_PORT', default='8765') }}"
LAYA_LOG_COLOR = "{{ get_env(name='LAYA_LOG_COLOR', default='auto') }}"

[tasks.serve]
description = "Serve Laya on POST /v1/systemone"
run = 'uv run --extra "$LAYA_BACKEND" python laya_shim.py'

[tasks.bench]
description = "Measure request latency against a running server"
# --no-project keeps uv from syncing .venv, which would remove the backend
# packages that `serve` installed. bench.py only needs the standard library.
run = "uv run --no-project python bench.py"


[hooks]
enter = ["hk install --mise"]
