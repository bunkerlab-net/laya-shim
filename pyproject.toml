[project]
name = "laya-shim"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
mlx = ["laya-mlx"]
torch = ["laya"]

[project.scripts]
laya-shim = "laya_shim.server:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: loads the Laya checkpoint, so it needs a backend installed"]
